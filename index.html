<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ VONGOLA WAR ANALYTICS ⚔</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap');

  :root {
    --gold: #c9a227;
    --gold-light: #f0c94d;
    --gold-dark: #8a6c10;
    --black: #0a0a0a;
    --dark: #111111;
    --dark2: #1a1a1a;
    --dark3: #222222;
    --text: #e8e0cc;
    --red: #e63946;
    --pink: #ff69b4;
    --green: #39ff14;
    --yellow: #ffe600;
    --cyan: #00e5ff;
    --text-dim: #9a8f70;

    /* class accent colors — single source of truth, used by roster, MVP, and team builder alike */
    --c-numina: #c9a227;
    --c-celestune: #00e5ff;
    --c-nightwalker: #8a6cff;
    --c-bloodstorm: #e63946;
    --c-ironclad: #6fae5c;
    --c-dragonsvelte: #ff8a3d;
    --c-sylph: #ff69b4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at top, #1a1200 0%, transparent 60%),
      radial-gradient(ellipse at bottom, #0d0900 0%, transparent 60%);
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 32px 20px 20px;
    border-bottom: 1px solid var(--gold-dark);
    position: relative;
  }
  .header::before, .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    height: 2px;
    width: 60%;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    letter-spacing: 0.15em;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(201,162,39,0.5), 0 2px 4px #000;
  }
  .header h1 span { color: var(--gold); }

  /* CONTROLS */
  .controls {
    display: flex;
    gap: 16px;
    padding: 20px 24px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--dark2);
    border-bottom: 1px solid #2a2200;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .control-label {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    letter-spacing: 0.08em;
    font-weight: 700;
    min-width: 52px;
  }
  select {
    background: var(--dark3);
    color: var(--text);
    border: 1px solid var(--gold-dark);
    padding: 8px 14px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 2px;
    cursor: pointer;
    min-width: 180px;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus { border-color: var(--gold); }

  /* MAIN */
  .main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  /* PLAYER STATS SECTION */
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 0.12em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--gold-dark), transparent);
  }

  .player-card {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    margin-bottom: 20px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: var(--gold-dark);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    padding: 10px 12px;
    text-align: center;
    border: 1px solid #5a4010;
  }
  tbody td {
    padding: 10px 12px;
    text-align: center;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid #2a2200;
    color: var(--text);
  }
  tbody tr:hover { background: #1f1800; }
  .class-cell {
    color: var(--gold-light);
    font-weight: 700;
  }

  /* KDA */
  .kda-badge {
    display: inline-block;
    background: var(--gold-dark);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    padding: 2px 8px;
    letter-spacing: 0.1em;
    border: 1px solid var(--gold);
    margin: 0 6px;
  }
  .kda-value {
    color: var(--gold-light);
    font-size: 1.05rem;
    font-weight: 700;
  }

  .match-header-row th { background: #1a2a3a; color: var(--cyan); }

  /* MVP BOARD */
  .mvp-section { margin-top: 32px; }
  .mvp-title {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    color: var(--gold-light);
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 0.15em;
    text-shadow: 0 0 20px rgba(201,162,39,0.4);
  }
  .mvp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .mvp-card {
    background: var(--dark2);
    border: 1px solid #2a2200;
    overflow: hidden;
  }
  .mvp-card-title {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.12em;
    padding: 10px 14px;
    text-align: center;
    font-weight: 900;
    border-bottom: 1px solid #333;
  }
  .mvp-kill .mvp-card-title   { background: #c0002a; color: #fff; }
  .mvp-heal .mvp-card-title   { background: #9b0075; color: #fff; }
  .mvp-tower .mvp-card-title  { background: #007a00; color: #fff; }
  .mvp-tank .mvp-card-title   { background: #8a8a00; color: #fff; }
  .mvp-dmg .mvp-card-title    { background: #7a2a00; color: #fff; }
  .mvp-assist .mvp-card-title { background: #006880; color: #fff; }

  .mvp-rows { padding: 12px 14px; }
  .mvp-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #2a2200;
    font-size: 0.92rem;
    font-weight: 600;
  }
  .mvp-row:last-child { border-bottom: none; }
  .mvp-row .rank {
    color: var(--gold-dark);
    font-size: 0.75rem;
    margin-right: 6px;
  }
  .mvp-row .val { color: var(--gold-light); font-weight: 700; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 1rem;
  }

  /* DIVIDER */
  .gold-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dark), transparent);
    margin: 24px 0;
  }

  /* STATS BAR */
  .stats-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-chip {
    background: var(--dark3);
    border: 1px solid #2a2200;
    padding: 6px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-chip .lbl { color: #888; font-size: 0.75rem; }
  .stat-chip .val { color: var(--gold-light); }

  /* TABS */
  .main-tabs {
    display: flex;
    gap: 0;
    background: var(--dark2);
    border-bottom: 2px solid var(--gold-dark);
    padding: 0 24px;
  }
  .main-tab {
    font-family: 'Cinzel', serif;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    padding: 12px 22px;
    cursor: pointer;
    color: #666;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.15s;
  }
  .main-tab:hover { color: var(--text); }
  .main-tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }

  /* COMPARE */
  .compare-selects { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .compare-selects select { min-width: 160px; }
  .compare-vs { font-family: 'Cinzel', serif; color: var(--gold); font-size: 1.1rem; font-weight: 900; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .compare-card { background: var(--dark3); border: 1px solid #2a2200; padding: 14px; }
  .compare-name { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold-light); font-weight: 900; margin-bottom: 4px; }
  .compare-class { font-size: 0.78rem; color: #888; margin-bottom: 12px; }
  .compare-stat-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #2a2000; font-size: 0.88rem; font-weight: 600; }
  .compare-stat-row:last-child { border-bottom: none; }
  .compare-stat-row .lbl { color: #888; }
  .compare-stat-row .val { color: var(--text); }
  .compare-stat-row .val.win { color: var(--green); }
  .compare-bar-wrap { margin-top: 16px; }
  .compare-bar-label { font-size: 0.75rem; color: #888; margin-bottom: 4px; }
  .compare-bar-dual { display: flex; height: 18px; background: #111; border: 1px solid #2a2000; overflow: hidden; margin-bottom: 8px; }
  .compare-bar-a { background: var(--cyan); height: 100%; transition: width 0.4s; }
  .compare-bar-b { background: var(--pink); height: 100%; transition: width 0.4s; }
  .compare-legend { display: flex; gap: 16px; font-size: 0.75rem; margin-top: 10px; }
  .compare-legend span { display: flex; align-items: center; gap: 5px; }
  .compare-legend .dot { width: 10px; height: 10px; border-radius: 50%; }

  /* SORT HIGHLIGHT */
  select#sortSelect.active-sort {
    border-color: var(--green) !important;
    color: var(--green) !important;
    box-shadow: 0 0 6px rgba(0,255,100,0.3);
  }

  /* TREND */
  .trend-wrap {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    margin-bottom: 20px;
    padding: 16px 20px;
    overflow-x: auto;
  }
  canvas.trend-canvas { display: block; }
  .guild-stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .guild-stat-box {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    padding: 16px;
    text-align: center;
  }
  .guild-stat-box .label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    color: var(--gold);
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .guild-stat-box .value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
  }
  .role-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .role-card {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--cyan);
    padding: 14px;
  }
  .role-card .role-title {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--cyan);
    margin-bottom: 10px;
    letter-spacing: 0.06em;
  }
  .role-card ol { margin: 0; padding-left: 20px; }
  .role-card li { margin-bottom: 6px; font-size: 0.95rem; }
  .consistency-badge {
    display: inline-block;
    background: var(--dark3);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }

  /* ============================================================ */
  /* TEAM BUILDER TAB (merged from war board)                      */
  /* ============================================================ */
  .chip-icon { width:18px; height:18px; border-radius:50%; vertical-align:middle; margin-right:6px; flex-shrink:0; object-fit:cover; }

  .tb-toolbar {
    display: flex;
    gap: 10px;
    padding: 14px 0 18px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }
  .tb-toolbar-left, .tb-toolbar-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    font-weight: 700;
    background: var(--dark3);
    color: var(--gold-light);
    border: 1px solid var(--gold-dark);
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--gold-dark); color: #fff; }
  .btn.primary { background: var(--gold-dark); color: #fff; border-color: var(--gold); }
  .btn.primary:hover { background: var(--gold); color: #1a1200; }
  .btn.ghost { background: transparent; }
  .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

  .save-status { font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.04em; min-width: 110px; }
  .save-status.saved { color: var(--green); }

  .tb-layout { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .tb-layout { grid-template-columns: 1fr; } }

  .pool {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    padding: 16px 14px;
    position: sticky;
    top: 12px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
  }
  @media (max-width: 900px) { .pool { position: static; max-height: none; } }
  .pool-search {
    width: 100%;
    background: var(--dark3);
    border: 1px solid var(--gold-dark);
    color: var(--text);
    padding: 8px 10px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: 2px;
    margin-bottom: 12px;
    outline: none;
  }
  .pool-search:focus { border-color: var(--gold); }
  .pool-search::placeholder { color: var(--text-dim); }
  .pool-count { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 10px; letter-spacing: 0.04em; }
  .pool-count b { color: var(--gold-light); }

  .class-group { margin-bottom: 14px; }
  .class-group-title {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 8px;
    margin-bottom: 6px;
    border-left: 3px solid var(--accent, var(--gold));
    color: var(--accent, var(--gold-light));
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .class-group-title .grp-name { display:flex; align-items:center; }
  .class-group-title .n { color: var(--text-dim); font-weight: 600; }

  .pool-chip-wrap { display: flex; flex-direction: column; gap: 5px; }
  .player-chip {
    background: var(--dark3);
    border: 1px solid #3a3320;
    border-left: 4px solid var(--accent, var(--gold));
    color: var(--text);
    padding: 7px 10px;
    font-size: 0.88rem;
    font-weight: 600;
    border-radius: 2px;
    cursor: grab;
    user-select: none;
    transition: background 0.12s;
    display: flex;
    align-items: center;
  }
  .player-chip:hover { background: #2a2510; }
  .player-chip:active { cursor: grabbing; }
  .player-chip.dragging { opacity: 0.4; }
  .pool-empty { text-align: center; color: var(--text-dim); font-size: 0.85rem; padding: 20px 10px; }

  .tb-board {}
  .zone {
    background: var(--dark2);
    border: 1px solid var(--gold-dark);
    border-top: 2px solid var(--gold);
    margin-bottom: 22px;
    overflow: hidden;
  }
  .zone-head {
    background: linear-gradient(90deg, #2a2200, #1a1500);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--gold-dark);
  }
  .zone-title-input {
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--gold-light);
    background: transparent;
    border: 1px solid transparent;
    padding: 4px 8px;
    border-radius: 2px;
    flex: 1;
    min-width: 120px;
    outline: none;
  }
  .zone-title-input:hover { border-color: #3a3320; }
  .zone-title-input:focus { border-color: var(--gold); background: var(--dark3); }
  .zone-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    width: 30px; height: 30px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--gold-dark); color: #fff; }
  .icon-btn.danger:hover { background: #6e1c22; border-color: #6e1c22; }

  .zone-body { padding: 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  @media (max-width: 1300px) { .zone-body { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 1050px) { .zone-body { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 700px)  { .zone-body { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px)  { .zone-body { grid-template-columns: 1fr; } }

  .team-card { background: var(--dark3); border: 1px solid #3a3320; border-radius: 2px; overflow: hidden; }
  .team-head {
    background: #1f1a08;
    padding: 7px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--gold-dark);
  }
  .team-name-input {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--gold-light);
    background: transparent;
    border: 1px solid transparent;
    padding: 3px 6px;
    border-radius: 2px;
    flex: 1;
    min-width: 60px;
    outline: none;
  }
  .team-name-input:hover { border-color: #4a4330; }
  .team-name-input:focus { border-color: var(--gold); background: var(--dark2); }
  .team-fill { font-size: 0.65rem; color: var(--text-dim); white-space: nowrap; padding-right: 2px; }
  .team-fill.full { color: var(--green); }

  .slot-list { display: flex; flex-direction: column; gap: 5px; padding: 8px; }
  .slot {
    min-height: 34px;
    border: 1px dashed #4a4330;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    transition: background 0.12s, border-color 0.12s;
    position: relative;
  }
  .slot.drag-over { border-color: var(--gold-light); background: rgba(201,162,39,0.12); }
  .slot.filled {
    border-style: solid;
    border-color: #3a3320;
    background: var(--dark2);
    justify-content: space-between;
    padding: 0 8px 0 10px;
    cursor: grab;
  }
  .slot.filled:active { cursor: grabbing; }
  .slot.filled.dragging { opacity: 0.4; }
  .slot-name { font-weight: 700; color: var(--text); font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display:flex; align-items:center; }
  .slot-class-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent, var(--gold)); }
  .slot-remove { background: transparent; border: none; color: var(--text-dim); cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px 2px; flex-shrink: 0; }
  .slot-remove:hover { color: var(--red); }

  .add-team-btn {
    background: transparent;
    border: 1px dashed var(--gold-dark);
    color: var(--text-dim);
    border-radius: 2px;
    min-height: 100px;
    cursor: pointer;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    transition: all 0.15s;
  }
  .add-team-btn:hover { border-color: var(--gold); color: var(--gold-light); background: rgba(201,162,39,0.06); }

  .board-empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .board-empty .big { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.08em; }

  .tb-legend { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 0 0 14px; font-size: 0.72rem; color: var(--text-dim); }
  .tb-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .tb-legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .toast {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--dark3);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    padding: 10px 20px;
    border-radius: 2px;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
  }

<body>

<div class="header">
  <h1><span>⚔</span> VONGOLA WAR ANALYTICS <span>⚔</span></h1>
</div>

<div class="controls">
  <div class="control-group">
    <span class="control-label">WAR</span>
    <select id="warSelect" onchange="onWarChange()">
      <option value="ALL">— ALL WARS —</option>
    </select>
  </div>
  <div class="control-group">
    <span class="control-label">PLAYER</span>
    <select id="playerSelect" onchange="renderPlayerStats()">
      <option value="ALL">— ALL PLAYERS —</option>
    </select>
  </div>
  <div class="control-group">
    <span class="control-label">CLASS</span>
    <select id="classSelect" onchange="onClassChange()">
      <option value="ALL">— ALL CLASSES —</option>
    </select>
  </div>
  <div class="control-group">
    <span class="control-label">SORT BY</span>
    <select id="sortSelect" onchange="onSortChange()">
      <option value="kda">KDA</option>
      <option value="Kill">Kill</option>
      <option value="Assist">Assist</option>
      <option value="Dmg">Dmg</option>
      <option value="Tank">Tank</option>
      <option value="Tower">Tower</option>
      <option value="Heal">Heal</option>
      <option value="Revive">Revive</option>
      <option value="Morale">Morale</option>
      <option value="Death">Death (น้อยสุด)</option>
    </select>
  </div>
</div>

<div class="main-tabs">
  <button class="main-tab active" id="tabStats" onclick="switchTab('stats')">⚔ STATS</button>
  <button class="main-tab" id="tabCompare" onclick="switchTab('compare')">⚔ HEAD-TO-HEAD</button>
  <button class="main-tab" id="tabGuild" onclick="switchTab('guild')">🏯 GUILD OVERVIEW</button>
  <button class="main-tab" id="tabTeam" onclick="switchTab('team')">🛡 TEAM BUILD</button>
</div>

<div class="main">
  <!-- STATS TAB -->
  <div id="panelStats">
    <div id="playerSection"></div>
    <div class="gold-divider"></div>
    <div class="mvp-section">
      <div class="mvp-title">🏆 MVP BOARD</div>
      <div class="mvp-grid" id="mvpGrid"></div>
    </div>
  </div>

  <!-- COMPARE TAB -->
  <div id="panelCompare" style="display:none">
    <div class="section-title">⚔ HEAD-TO-HEAD</div>
    <div class="player-card" style="padding:20px">
      <div class="compare-selects">
        <span class="control-label" style="min-width:auto">CLASS</span>
        <select id="cmpClass" onchange="onCmpClassChange()">
          <option value="ALL">— ALL —</option>
        </select>
      </div>
      <div class="compare-selects">
        <select id="cmpA" onchange="renderCompare()"><option value="">— Player A —</option></select>
        <span class="compare-vs">VS</span>
        <select id="cmpB" onchange="renderCompare()"><option value="">— Player B —</option></select>
      </div>
      <div id="compareResult"><div class="empty-state">เลือก Player สองคนเพื่อเปรียบเทียบ</div></div>
    </div>
  </div>

  <!-- GUILD OVERVIEW TAB -->
  <div id="panelGuild" style="display:none">
    <div id="guildOverviewSection"></div>
  </div>

  <!-- TEAM BUILD TAB -->
  <div id="panelTeam" style="display:none">
    <div class="section-title">🛡 TEAM BUILD — ลากรายชื่อจากคลังกำลังพลไปวางในทีม</div>
    <div class="tb-toolbar">
      <div class="tb-toolbar-left">
        <button class="btn primary" id="btnAddZone">+ เพิ่มโซน</button>
        <button class="btn ghost" id="btnClearBoard">ล้างกระดานทั้งหมด</button>
      </div>
      <div class="tb-toolbar-right">
        <span class="save-status" id="saveStatus">บันทึกแล้ว</span>
        <button class="btn" id="btnExport">⤓ Export JSON</button>
        <button class="btn" id="btnImport">⤒ Import JSON</button>
        <input type="file" id="fileImport" accept="application/json" style="display:none">
      </div>
    </div>
    <div class="tb-legend" id="tbLegend"></div>
    <div class="tb-layout">
      <aside class="pool">
        <div class="pool-title" style="font-family:'Cinzel',serif;font-size:0.85rem;color:var(--gold);letter-spacing:0.1em;margin-bottom:10px;">🪖 คลังกำลังพล</div>
        <input type="text" class="pool-search" id="poolSearch" placeholder="ค้นหาชื่อผู้เล่น...">
        <div class="pool-count" id="poolCount"></div>
        <div id="poolList"></div>
      </aside>
      <main class="tb-board" id="tbBoard"></main>
    </div>
  </div>
</div>

const wars = [...new Set(RAW.map(r => r.War))];
const allPlayers = [...new Set(RAW.map(r => r.Player))].sort();

// Populate dropdowns
const warSel = document.getElementById('warSelect');
const playerSel = document.getElementById('playerSelect');
const classSel = document.getElementById('classSelect');

wars.forEach(w => {
  const o = document.createElement('option'); o.value = w; o.textContent = w; warSel.appendChild(o);
});
allPlayers.forEach(p => {
  const o = document.createElement('option'); o.value = p; o.textContent = p; playerSel.appendChild(o);
});
const allClasses = [...new Set(RAW.map(r => r.Class))].sort();
allClasses.forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c; classSel.appendChild(o);
});

function getFiltered() {
  const war = warSel.value;
  const player = playerSel.value;
  const cls = classSel.value;
  return RAW.filter(r =>
    (war === 'ALL' || r.War === war) &&
    (player === 'ALL' || r.Player === player) &&
    (cls === 'ALL' || r.Class === cls)
  );
}

function onWarChange() {
  const war = warSel.value;
  const cls = classSel.value;
  const players = [...new Set(RAW.filter(r =>
    (war === 'ALL' || r.War === war) &&
    (cls === 'ALL' || r.Class === cls)
  ).map(r => r.Player))].sort();

  const cur = playerSel.value;
  playerSel.innerHTML = '<option value="ALL">— ALL PLAYERS —</option>';
  players.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    if (p === cur) o.selected = true;
    playerSel.appendChild(o);
  });
  renderAll();
  if (document.getElementById("panelGuild").style.display !== "none") renderGuildOverview();
}

function onClassChange() {
  // Reset player dropdown when class changes
  const cls = classSel.value;
  const war = warSel.value;
  const players = [...new Set(RAW.filter(r =>
    (war === 'ALL' || r.War === war) &&
    (cls === 'ALL' || r.Class === cls)
  ).map(r => r.Player))].sort();
  const cur = playerSel.value;
  playerSel.innerHTML = '<option value="ALL">— ALL PLAYERS —</option>';
  players.forEach(p => {
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    if (p === cur) o.selected = true;
    playerSel.appendChild(o);
  });
  renderAll();
}

function trueDmg(val) { return val || 0; }

function kda(r) {

    const d = r.Death || 1;

    const kill   = r.Kill || 0;
    const assist = r.Assist || 0;
    const tank   = r.Tank || 0;
    const tower  = r.Tower || 0;
    const revive = r.Revive || 0;
    const morale = r.Morale || 0;

    const dmgVal = trueDmg(r.Dmg || 0);

    switch(r.Class) {

        case 'Numina':
        case 'Celestune':
            return (((kill + assist * 0.5 + tank * 0.01 + tower * 0.01 + dmgVal * 0.0001) / d)).toFixed(2);

        case 'Bloodstorm':
        case 'Nightwalker':
            return (((kill + assist * 0.5 + tank * 0.01 + tower * 0.01 + morale * 0.01 + dmgVal * 0.0001) / d)).toFixed(2);

        case 'Sylph':
            return (((kill + assist * 0.5 + revive * 5 + tank * 0.01) / d)).toFixed(2);

        case 'Ironclad':
            return (((kill + assist * 0.5 + tank * 0.02 + tower * 0.01 + dmgVal * 0.0001) / d)).toFixed(2);

        default:
            return (((kill + assist * 0.5) / d)).toFixed(2);
    }
}

function fmt(n) { return (n||0).toLocaleString(); }
const NO_K_PLAYERS = ['MíMí', 'WonyoungX', '雪蘭 Sylvie', 'Li Meihua'];
function fmtDmg(n, r) {
  const val = (n || 0).toLocaleString();
  if (r && NO_K_PLAYERS.includes(r.Player)) {
    return val;
  }
  return val + 'K';
}
function fmtTower(n, r) { 
  if (r && NO_K_PLAYERS.includes(r.Player)) return (n || 0).toLocaleString();
  return (n || 0).toLocaleString() + 'K'; 
}

function renderGuildOverview() {
  const war = warSel.value;
  const data = war === 'ALL' ? RAW : RAW.filter(r => r.War === war);

  // ===== 1. GUILD AVERAGES PER GAME (filtered by relevant classes per metric) =====
  const avgOf = (arr, key) => arr.length ? (arr.reduce((s,r) => s + (r[key]||0), 0) / arr.length) : 0;
  const avgDmgOf = (arr) => arr.length ? (arr.reduce((s,r) => s + trueDmg(r.Dmg||0), 0) / arr.length) : 0;
  const inClass = (classes) => data.filter(r => classes.includes(r.Class));

  const killClasses = ['Numina','Celestune','Nightwalker','Bloodstorm','Dragonsvelte'];
  const dmgClasses = ['Numina','Celestune','Nightwalker','Bloodstorm','Ironclad','Dragonsvelte'];
  const towerClasses = ['Numina','Celestune'];

  const killData = inClass(killClasses);
  const dmgData = inClass(dmgClasses);
  const towerData = inClass(towerClasses);
  const ironcladData = inClass(['Ironclad']);
  const sylphData = inClass(['Sylph']);
  const tankAllData = data; // overall tank avg, ironclad+sylph highlighted separately

  const avgKill = avgOf(killData, 'Kill').toFixed(0);
  const avgDmg = avgDmgOf(dmgData).toFixed(0);
  const avgTank = avgOf(tankAllData, 'Tank').toFixed(0);
  const avgTankIronclad = avgOf(ironcladData, 'Tank').toFixed(0);
  const avgTankSylph = avgOf(sylphData, 'Tank').toFixed(0);
  const avgTower = avgOf(towerData, 'Tower').toFixed(0);
  const avgHeal = avgOf(sylphData, 'Heal').toFixed(0);
  const avgRevive = avgOf(sylphData, 'Revive').toFixed(1);
  const attendance = new Set(data.map(r => r.Player)).size;
  const avgKDA = data.length ? (data.reduce((s,r) => s + parseFloat(kda(r)), 0) / data.length).toFixed(2) : '0.00';

  let html = `<div class="section-title">🏯 GUILD OVERVIEW — ${war === 'ALL' ? 'ALL WARS' : war}</div>`;
  html += `<div class="guild-stat-grid">
    <div class="guild-stat-box"><div class="label">ATTENDANCE</div><div class="value">${attendance}</div></div>
    <div class="guild-stat-box"><div class="label">AVG KILL</div><div class="value">${fmt(avgKill)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG DMG</div><div class="value">${fmtDmg(avgDmg)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG TANK</div><div class="value">${fmt(avgTank)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG TOWER</div><div class="value">${fmtTower(avgTower)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG HEAL</div><div class="value">${fmt(avgHeal)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG REVIVE</div><div class="value">${fmt(avgRevive)}</div></div>
    <div class="guild-stat-box"><div class="label">AVG KDA</div><div class="value" style="color:var(--green)">${avgKDA}</div></div>
  </div>`;

  // ===== 1b. GUILD TREND ACROSS WARS (only meaningful when ALL selected) =====
  if (war === 'ALL') {
    html += `<div class="section-title">📈 GUILD TREND BY WAR</div>`;
    html += `<table><thead><tr><th>WAR</th><th>ATTENDANCE</th><th>AVG KDA</th><th>AVG KILL</th><th>AVG DMG</th></tr></thead><tbody>`;
    wars.forEach(w => {
      const wd = RAW.filter(r => r.War === w);
      const wAtt = new Set(wd.map(r => r.Player)).size;
      const wn = wd.length || 1;
      const wAvgKDA = wd.length ? (wd.reduce((s,r) => s + parseFloat(kda(r)), 0) / wd.length).toFixed(2) : '0.00';
      const wKill = (wd.reduce((s,r) => s + (r.Kill||0), 0) / wn).toFixed(0);
      const wDmg = (wd.reduce((s,r) => s + trueDmg(r.Dmg||0), 0) / wn).toFixed(0);
      html += `<tr><td>${w}</td><td>${wAtt}</td><td style="color:var(--green)">${wAvgKDA}</td><td>${fmt(wKill)}</td><td>${fmtDmg(wDmg)}</td></tr>`;
    });
    html += `</tbody></table><br>`;
  }

  // ===== 2. CLASS BREAKDOWN (unique players only, not double-counted across wars) =====
  html += `<div class="section-title">⚙ CLASS BREAKDOWN</div>`;
  html += `<table><thead><tr><th>CLASS</th><th>PLAYERS</th><th>AVG KILL</th><th>AVG ASSIST</th><th>AVG TANK</th><th>AVG TOWER</th><th>AVG HEAL</th><th>AVG DMG</th><th>AVG KDA</th></tr></thead><tbody>`;
  allClasses.forEach(c => {
    const cd = data.filter(r => r.Class === c);
    if (!cd.length) return;
    // group by player first so each player counts once regardless of how many wars they appear in this class
    const byP = {};
    cd.forEach(r => {
      if (!byP[r.Player]) byP[r.Player] = [];
      byP[r.Player].push(r);
    });
    const playerAverages = Object.values(byP).map(rows => {
      const m = rows.length;
      return {
        Kill: rows.reduce((s,r) => s + (r.Kill||0), 0) / m,
        Assist: rows.reduce((s,r) => s + (r.Assist||0), 0) / m,
        Tank: rows.reduce((s,r) => s + (r.Tank||0), 0) / m,
        Tower: rows.reduce((s,r) => s + (r.Tower||0), 0) / m,
        Heal: rows.reduce((s,r) => s + (r.Heal||0), 0) / m,
        Dmg: rows.reduce((s,r) => s + trueDmg(r.Dmg||0), 0) / m,
        kda: rows.reduce((s,r) => s + parseFloat(kda(r)), 0) / m,
      };
    });
    const np = playerAverages.length;
    const avg = (key) => (playerAverages.reduce((s,p) => s + p[key], 0) / np).toFixed(0);
    const avgKdaC = (playerAverages.reduce((s,p) => s + p.kda, 0) / np).toFixed(2);
    html += `<tr>
      <td class="class-cell"><img src="${CLASS_ICONS[c]||''}" title="${c}" style="width:24px;height:24px;vertical-align:middle;border-radius:50%"> ${c}</td>
      <td>${np}</td><td>${avg('Kill')}</td><td>${avg('Assist')}</td><td>${avg('Tank')}</td><td>${avg('Tower')}</td><td>${avg('Heal')}</td><td>${fmtDmg(avg('Dmg'))}</td>
      <td style="color:var(--green)">${avgKdaC}</td>
    </tr>`;
  });
  html += `</tbody></table><br>`;

  // ===== 3. CONSISTENCY RANKING =====
  const byPlayer = {};
  data.forEach(r => {
    if (!byPlayer[r.Player]) byPlayer[r.Player] = [];
    byPlayer[r.Player].push(parseFloat(kda(r)));
  });
  const consistency = Object.entries(byPlayer)
    .filter(([p, arr]) => arr.length >= 2)
    .map(([p, arr]) => {
      const mean = arr.reduce((s,v) => s+v, 0) / arr.length;
      const variance = arr.reduce((s,v) => s + Math.pow(v-mean,2), 0) / arr.length;
      const stdev = Math.sqrt(variance);
      return { player: p, mean, stdev, n: arr.length };
    })
    .filter(x => x.mean > 0)
    .sort((a,b) => (a.stdev/a.mean) - (b.stdev/b.mean))
    .slice(0, 5);

  html += `<div class="section-title">📏 MOST CONSISTENT</div>`;
  html += `<div class="role-card-grid"><div class="role-card"><div class="role-title">🎯 CONSISTENCY RANKING</div><ol>`;
  consistency.forEach(c => {
    html += `<li>${c.player} — avg KDA <b style="color:var(--green)">${c.mean.toFixed(2)}</b><span class="consistency-badge">±${c.stdev.toFixed(2)}</span> (${c.n} wars)</li>`;
  });
  if (!consistency.length) html += `<li style="color:#888">ข้อมูลไม่พอ (ต้องมีอย่างน้อย 2 War ต่อผู้เล่น)</li>`;
  html += `</ol></div>`;

  // ===== 4. ROLE-BASED INSIGHT =====
  const supportBest = {};
  data.forEach(r => {
    const score = (r.Heal||0) + (r.Revive||0)*10;
    if (score > 0 && (!supportBest[r.Player] || score > supportBest[r.Player].score)) {
      supportBest[r.Player] = { player: r.Player, war: r.War, score };
    }
  });
  const supportScores = Object.values(supportBest).sort((a,b) => b.score - a.score).slice(0,5);

  const dmgEffBest = {};
  data.filter(r => r.Class !== 'Sylph').forEach(r => {
    const eff = trueDmg(r.Dmg||0) / (r.Death || 1);
    if (!dmgEffBest[r.Player] || eff > dmgEffBest[r.Player].eff) {
      dmgEffBest[r.Player] = { player: r.Player, war: r.War, eff };
    }
  });
  const dmgEff = Object.values(dmgEffBest).sort((a,b) => b.eff - a.eff).slice(0,5);

  html += `<div class="role-card"><div class="role-title">💚 TOP SUPPORT</div><ol>`;
  supportScores.forEach(s => { html += `<li>${s.player} <span style="color:#555;font-size:0.75rem">(${s.war})</span> — <b style="color:var(--cyan)">${fmt(s.score.toFixed(0))}</b></li>`; });
  if (!supportScores.length) html += `<li style="color:#888">ไม่มีข้อมูล</li>`;
  html += `</ol></div>`;

  html += `<div class="role-card"><div class="role-title">⚡ DAMAGE EFFICIENCY</div><ol>`;
  dmgEff.forEach(s => { html += `<li>${s.player} <span style="color:#555;font-size:0.75rem">(${s.war})</span> — <b style="color:var(--red)">${fmtDmg(s.eff.toFixed(0))}</b></li>`; });
  html += `</ol></div></div>`;

  document.getElementById('guildOverviewSection').innerHTML = html;
}

    html += `<div class="section-title">📋 MATCH HISTORY</div>
    <div class="player-card">
      <table>
        <thead><tr>
          <th>War</th><th>Kill</th><th>Assist</th><th>Heal</th><th>Tank</th><th>Tower</th><th>Revive</th><th>Morale</th><th>Dmg</th><th>Death</th>
        </tr></thead>
        <tbody>`;
    rows.forEach((r) => {
      html += `<tr>
        <td style="color:var(--gold);font-weight:700">${r.War}</td>
        <td>${fmt(r.Kill)}</td><td>${fmt(r.Assist)}</td>
        <td>${fmt(r.Heal||0)}</td><td>${fmt(r.Tank)}</td>
        <td>${fmtTower(r.Tower, r)}</td><td>${fmt(r.Revive)}</td>
        <td>${fmt(r.Morale||0)}</td><td>${fmtDmg(r.Dmg, r)}</td>
        <td>${fmt(r.Death)}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;

    // เพิ่ม trend section ถ้ามีมากกว่า 1 war
    if (rows.length >= 2) {
      html += `<div class="section-title">📈 KDA TREND</div>
      <div class="trend-wrap"><canvas id="trendCanvas" class="trend-canvas" height="200"></canvas></div>`;
    }

    sec.innerHTML = html;

    // วาด trend chart หลัง DOM อัพเดท
    if (rows.length >= 2) {
      const canvas = document.getElementById('trendCanvas');
      const ctx = canvas.getContext('2d');
      const W = Math.max(canvas.parentElement.clientWidth - 40, 300);
      canvas.width = W; canvas.height = 200;
      const kdaVals = rows.map(r => parseFloat(kda(r)));
      const minV = Math.min(...kdaVals) * 0.85;
      const maxV = Math.max(...kdaVals) * 1.15;
      const pad = { l: 50, r: 20, t: 20, b: 40 };
      const cW = W - pad.l - pad.r;
      const cH = 200 - pad.t - pad.b;
      const xPos = (i) => pad.l + (rows.length === 1 ? cW/2 : i / (rows.length-1) * cW);
      const yPos = (v) => pad.t + (1 - (v - minV) / (maxV - minV)) * cH;
      // Grid
      ctx.strokeStyle = '#2a2200'; ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = pad.t + (i/4) * cH;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
        const val = (maxV - (maxV-minV)*(i/4)).toFixed(2);
        ctx.fillStyle = '#666'; ctx.font = '10px Rajdhani,sans-serif'; ctx.textAlign = 'right';
        ctx.fillText(val, pad.l - 6, y + 4);
      }
      // Fill under line
      ctx.beginPath();
      rows.forEach((r,i) => { i===0 ? ctx.moveTo(xPos(i), yPos(kdaVals[i])) : ctx.lineTo(xPos(i), yPos(kdaVals[i])); });
      ctx.lineTo(xPos(rows.length-1), pad.t+cH); ctx.lineTo(xPos(0), pad.t+cH); ctx.closePath();
      ctx.fillStyle = 'rgba(201,162,39,0.08)'; ctx.fill();
      // Line
      ctx.beginPath(); ctx.strokeStyle = '#f0c94d'; ctx.lineWidth = 2.5;
      rows.forEach((r,i) => { i===0 ? ctx.moveTo(xPos(i), yPos(kdaVals[i])) : ctx.lineTo(xPos(i), yPos(kdaVals[i])); });
      ctx.stroke();
      // Dots & labels
      rows.forEach((r,i) => {
        const x = xPos(i), y = yPos(kdaVals[i]);
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI*2);
        ctx.fillStyle = '#f0c94d'; ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#f0c94d'; ctx.font = 'bold 11px Rajdhani,sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(kdaVals[i].toFixed(2), x, y - 10);
        ctx.fillStyle = '#888'; ctx.font = '10px Rajdhani,sans-serif';
        ctx.fillText(r.War, x, 200 - pad.b + 14);
      });
    }

  } else {

    data.forEach(r => {

      .sort((a,b) => b._sortVal - a._sortVal);

    const sortLabels = {
      kda:'KDA', Kill:'Kill', Assist:'Assist', Dmg:'Dmg',

    <div class="player-card">
      <table>
        <thead><tr>
          <th>#</th><th style="text-align:left;padding-left:14px">Player</th><th>Class</th><th>Best Match</th>
          <th ${colHighlight('Kill')}>Kill</th>
          <th ${colHighlight('Assist')}>Assist</th>
          <th ${colHighlight('Heal')}>Heal</th>
          <th ${colHighlight('Tank')}>Tank</th>
          <th ${colHighlight('Tower')}>Tower</th>
          <th ${colHighlight('Revive')}>Revive</th>
          <th ${colHighlight('Morale')}>Morale</th>

          <th ${colHighlight('Death')}>Death</th>
          <th ${colHighlight('kda')}>K/D/A</th>
        </tr></thead>
        <tbody>`;
    sorted.forEach((r, i) => {
      const rankColor = i===0?'var(--gold-light)':i===1?'#b0b0b0':i===2?'#cd7f32':'#666';
      const hl = (col, val) => col === sortBy

      html += `<tr>

        <td class="class-cell"><img src="${CLASS_ICONS[r.Class]||''}" title="${r.Class}" style="width:28px;height:28px;vertical-align:middle;border-radius:50%"></td>
        <td style="color:var(--cyan);font-size:0.82rem;font-weight:700">${r.War}</td>
        ${hl('Kill', fmt(r.Kill))}${hl('Assist', fmt(r.Assist))}
        ${hl('Heal', fmt(r.Heal||0))}${hl('Tank', fmt(r.Tank))}
        ${hl('Tower', fmtTower(r.Tower, r))}${hl('Revive', fmt(r.Revive))}
        ${hl('Morale', fmt(r.Morale||0))}${hl('Dmg', fmtDmg(r.Dmg, r))}
        ${hl('Death', fmt(r.Death))}
        ${hl('kda', `<span class="kda-value">${kda(r)}</span>`)}
      </tr>`;
    });
    html += `</tbody></table></div>`;
    sec.innerHTML = html;
  }
}

// MVP uses ALL data (all wars), find best single-match record per player, then top 3
function rankVal(r, field) {
  const raw = r[field] || 0;
  if ((field === 'Dmg' || field === 'Tower') && !NO_K_PLAYERS.includes(r.Player)) {
    return raw * 1000; // ทุกคนมีหน่วยเป็น K ยกเว้น 4 คนนี้ ใช้ค่าจริงตอนจัดอันดับ
  }
  return raw;
}
function top3AllTime(field) {
  const bestByPlayer = {};
  RAW.forEach(r => {
    const raw_val = r[field] || 0;
    const val = rankVal(r, field);
    if (!bestByPlayer[r.Player] || val > bestByPlayer[r.Player].val) {
      bestByPlayer[r.Player] = { Player: r.Player, War: r.War, Class: r.Class, val, raw_val, field };
    }
  });
  return Object.values(bestByPlayer)
    .sort((a, b) => b.val - a.val)
    .slice(0, 3);
}

function mvpCard(cls, title, rows, field) {
  const medals = ['🥇','🥈','🥉'];
  let r = `<div class="mvp-card mvp-${cls}">
    <div class="mvp-card-title">${title}</div>
    <div class="mvp-rows">`;
  rows.forEach((p, i) => {
    r += `<div class="mvp-row">
      <span><span class="rank">${medals[i]}</span>${p.Player} <span style="color:#555;font-size:0.75rem">(${p.War})</span></span>
      <span class="val">${p.field === 'Dmg' ? fmtDmg(p.raw_val, p) : p.field === 'Tower' ? fmtTower(p.raw_val, p) : fmt(p.val)}</span>
    </div>`;
  });
  r += `</div></div>`;
  return r;
}

function renderMVP(data) {
  const grid = document.getElementById('mvpGrid');
  grid.innerHTML =
    mvpCard('kill',   '⚔ TOP KILL',   top3AllTime('Kill'),   'Kill') +
    mvpCard('heal',   '💚 TOP HEAL',   top3AllTime('Heal'),   'Heal') +
    mvpCard('tower',  '🏰 TOP TOWER',  top3AllTime('Tower'),  'Tower') +
    mvpCard('tank',   '🛡 TOP TANK',   top3AllTime('Tank'),   'Tank') +
    mvpCard('dmg',    '💥 TOP DMG',    top3AllTime('Dmg'),    'Dmg') +
    mvpCard('assist', '🤝 TOP ASSIST', top3AllTime('Assist'), 'Assist');
}

// ─── HEAD-TO-HEAD COMPARE ─────────────────────────────────────────────────
function renderCompare() {
  const pa = cmpA.value;
  const pb = cmpB.value;
  const el = document.getElementById('compareResult');
  if (!pa || !pb || pa === pb) {
    el.innerHTML = '<div class="empty-state">เลือก Player สองคนที่ต่างกันเพื่อเปรียบเทียบ</div>';
    return;
  }
  const rowsA = RAW.filter(r => r.Player === pa);
  const rowsB = RAW.filter(r => r.Player === pb);
  const avgA = (f) => f === 'kda' ? rowsA.reduce((s,r)=>s+parseFloat(kda(r)),0)/rowsA.length
    : rowsA.reduce((s,r)=>s+(r[f]||0),0)/rowsA.length;
  const avgB = (f) => f === 'kda' ? rowsB.reduce((s,r)=>s+parseFloat(kda(r)),0)/rowsB.length
    : rowsB.reduce((s,r)=>s+(r[f]||0),0)/rowsB.length;
  const FIELDS = [
    {f:'kda',   l:'KDA',    fmt:v=>v.toFixed(2), hw:true},
    {f:'Kill',  l:'Kill',   fmt:v=>v.toFixed(1), hw:true},
    {f:'Assist',l:'Assist', fmt:v=>v.toFixed(1), hw:true},
    {f:'Dmg',   l:'Dmg',    fmt:v=>v.toFixed(1), hw:true},
    {f:'Tank',  l:'Tank',   fmt:v=>v.toFixed(1), hw:true},
    {f:'Tower', l:'Tower',  fmt:v=>v.toFixed(1), hw:true},
    {f:'Heal',  l:'Heal',   fmt:v=>v.toFixed(1), hw:true},
    {f:'Revive',l:'Revive', fmt:v=>v.toFixed(1), hw:true},
    {f:'Morale',l:'Morale', fmt:v=>v.toFixed(1), hw:true},
    {f:'Death', l:'Death',  fmt:v=>v.toFixed(1), hw:false},
  ];
  const barsHtml = FIELDS.map(({f,l,fmt,hw}) => {
    const va = avgA(f), vb = avgB(f);
    const total = va + vb || 1;
    const pctA = (va/total*100).toFixed(1);
    const pctB = (vb/total*100).toFixed(1);
    const aWin = hw ? va > vb : va < vb;
    const bWin = hw ? vb > va : vb < va;
    return `<div class="compare-bar-label">${l} &nbsp;<span style="color:var(--cyan)">${fmt(va)}</span> vs <span style="color:var(--pink)">${fmt(vb)}</span></div>
    <div class="compare-bar-dual">
      <div class="compare-bar-a" style="width:${pctA}%;opacity:${aWin?1:0.4}"></div>
      <div class="compare-bar-b" style="width:${pctB}%;opacity:${bWin?1:0.4}"></div>
    </div>`;
  }).join('');
  const classA = rowsA[0]?.Class||'', classB = rowsB[0]?.Class||'';
  const kdaA = avgA('kda'), kdaB = avgB('kda');
  el.innerHTML = `
    <div class="compare-grid">
      <div class="compare-card" style="border-top:2px solid var(--cyan)">
        <div class="compare-name" style="color:var(--cyan)">${pa}</div>
        <div class="compare-class">${classA} · ${rowsA.length} Matches</div>
        <div class="compare-stat-row"><span class="lbl">Avg KDA</span><span class="val ${kdaA>=kdaB?'win':''}">${kdaA.toFixed(2)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Kill</span><span class="val ${avgA('Kill')>=avgB('Kill')?'win':''}">${avgA('Kill').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Death</span><span class="val ${avgA('Death')<=avgB('Death')?'win':''}">${avgA('Death').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Dmg</span><span class="val ${avgA('Dmg')>=avgB('Dmg')?'win':''}">${avgA('Dmg').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Tank</span><span class="val ${avgA('Tank')>=avgB('Tank')?'win':''}">${avgA('Tank').toFixed(1)}</span></div>
      </div>
      <div class="compare-card" style="border-top:2px solid var(--pink)">
        <div class="compare-name" style="color:var(--pink)">${pb}</div>
        <div class="compare-class">${classB} · ${rowsB.length} Matches</div>
        <div class="compare-stat-row"><span class="lbl">Avg KDA</span><span class="val ${kdaB>=kdaA?'win':''}">${kdaB.toFixed(2)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Kill</span><span class="val ${avgB('Kill')>=avgA('Kill')?'win':''}">${avgB('Kill').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Death</span><span class="val ${avgB('Death')<=avgA('Death')?'win':''}">${avgB('Death').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Dmg</span><span class="val ${avgB('Dmg')>=avgA('Dmg')?'win':''}">${avgB('Dmg').toFixed(1)}</span></div>
        <div class="compare-stat-row"><span class="lbl">Avg Tank</span><span class="val ${avgB('Tank')>=avgA('Tank')?'win':''}">${avgB('Tank').toFixed(1)}</span></div>
      </div>
    </div>
    <div class="compare-bar-wrap">
      ${barsHtml}
      <div class="compare-legend">
        <span><span class="dot" style="background:var(--cyan)"></span>${pa}</span>
        <span><span class="dot" style="background:var(--pink)"></span>${pb}</span>
      </div>
    </div>`;
}
renderCompare();

/* ============================================================ */
/* TEAM BUILDER MODULE (merged from war board)                   */
/* Reuses RAW + CLASS_ICONS already defined above as the single  */
/* source of truth, so roster + classes always stay in sync.     */
/* ============================================================ */

// Build the roster straight from the war stats data: one entry per
// unique player, using the class recorded on their first appearance.
const PLAYERS = Array.from(
  RAW.reduce((map, r) => { if (!map.has(r.Player)) map.set(r.Player, r.Class); return map; }, new Map()),
  ([Player, Class]) => ({ Player, Class })
).sort((a, b) => a.Player.localeCompare(b.Player));

const CLASS_COLOR = {
  Numina: 'var(--c-numina)',
  Celestune: 'var(--c-celestune)',
  Nightwalker: 'var(--c-nightwalker)',
  Bloodstorm: 'var(--c-bloodstorm)',
  Ironclad: 'var(--c-ironclad)',
  Dragonsvelte: 'var(--c-dragonsvelte)',
  Sylph: 'var(--c-sylph)'
};
const CLASS_ORDER = ['Numina', 'Celestune', 'Nightwalker', 'Bloodstorm', 'Ironclad', 'Dragonsvelte', 'Sylph'];

const TB_STORAGE_KEY = 'vongola_warboard_v1';
const SLOT_COUNT = 6; // per team

let tbState = { zones: [] }; // { id, name, teams: [ {id, name, slots: [playerName|null, ...]} ] }

function uid() { return Math.random().toString(36).slice(2, 10); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function playerClass(name) {
  const p = PLAYERS.find(p => p.Player === name);
  return p ? p.Class : null;
}
function classIcon(cls) { return CLASS_ICONS[cls] || ''; }
function getAssignedPlayers() {
  const set = new Set();
  tbState.zones.forEach(z => z.teams.forEach(t => t.slots.forEach(s => { if (s) set.add(s); })));
  return set;
}

let tbToastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(tbToastTimer);
  tbToastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

let tbSaveTimer = null;
function tbPersist() {
  const status = document.getElementById('saveStatus');
  status.textContent = 'กำลังบันทึก...';
  status.classList.remove('saved');
  clearTimeout(tbSaveTimer);
  tbSaveTimer = setTimeout(() => {
    try {
      localStorage.setItem(TB_STORAGE_KEY, JSON.stringify(tbState));
      status.textContent = '✓ บันทึกแล้ว';
      status.classList.add('saved');
    } catch (e) {
      status.textContent = 'บันทึกไม่สำเร็จ';
    }
  }, 250);
}

function tbLoad() {
  try {
    const raw = localStorage.getItem(TB_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.zones)) { tbState = parsed; return; }
    }
  } catch (e) {}
  // default starter layout — zone names below are plain inputs, fully editable, same as team names
  tbState = {
    zones: [
      { id: uid(), name: 'Mid Lane ( Hold )', teams: [mkTeam('Team A'), mkTeam('Team B'), mkTeam('Team C')] },
      { id: uid(), name: 'วาร์ปซ้าย / Left tp', teams: [mkTeam('Def'), mkTeam('Tower')] },
      { id: uid(), name: 'วาร์ปขวา / Right tp', teams: [mkTeam('Def'), mkTeam('Tower')] },
      { id: uid(), name: 'กำลังเสริม', teams: [mkTeam('สำรอง 1'), mkTeam('สำรอง 2')] }
    ]
  };
}
function mkTeam(name) { return { id: uid(), name, slots: Array(SLOT_COUNT).fill(null) }; }

/* ── LEGEND ──────────────────────────────────────────────── */
function renderTbLegend() {
  const el = document.getElementById('tbLegend');
  el.innerHTML = CLASS_ORDER.map(c =>
    `<span><img class="chip-icon" src="${classIcon(c)}"><i style="--accent:${CLASS_COLOR[c]}"></i>${c}</span>`
  ).join('');
}

/* ── POOL ────────────────────────────────────────────────── */
let tbDragData = null; // { player, from: {zoneId, teamId, slotIdx} | null }

function renderPool() {
  const search = document.getElementById('poolSearch').value.trim().toLowerCase();
  const assigned = getAssignedPlayers();
  const list = document.getElementById('poolList');
  const countEl = document.getElementById('poolCount');

  const available = PLAYERS.filter(p => !assigned.has(p.Player));
  const filtered = search ? available.filter(p => p.Player.toLowerCase().includes(search)) : available;

  countEl.innerHTML = `เหลือ <b>${available.length}</b> / ${PLAYERS.length} คน`;

  if (filtered.length === 0) {
    list.innerHTML = `<div class="pool-empty">${search ? 'ไม่พบชื่อที่ค้นหา' : 'จัดครบทุกคนแล้ว 🎉'}</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(p => { (groups[p.Class] = groups[p.Class] || []).push(p); });

  let html = '';
  CLASS_ORDER.forEach(cls => {
    if (!groups[cls]) return;
    const items = groups[cls];
    html += `<div class="class-group">
      <div class="class-group-title" style="--accent:${CLASS_COLOR[cls]}"><span class="grp-name"><img class="chip-icon" src="${classIcon(cls)}">${cls}</span><span class="n">${items.length}</span></div>
      <div class="pool-chip-wrap">`;
    items.forEach(p => {
      html += `<div class="player-chip" draggable="true" data-player="${escapeHtml(p.Player)}" style="--accent:${CLASS_COLOR[cls]}">
        <img class="chip-icon" src="${classIcon(cls)}"><span>${escapeHtml(p.Player)}</span>
      </div>`;
    });
    html += `</div></div>`;
  });
  list.innerHTML = html;

  list.querySelectorAll('.player-chip').forEach(chip => {
    chip.addEventListener('dragstart', e => {
      tbDragData = { player: chip.dataset.player, from: null };
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    chip.addEventListener('dragend', () => { chip.classList.remove('dragging'); tbDragData = null; });
  });
}

/* ── BOARD ───────────────────────────────────────────────── */
function renderBoard() {
  const board = document.getElementById('tbBoard');
  if (tbState.zones.length === 0) {
    board.innerHTML = `<div class="board-empty">
      <div class="big">ยังไม่มีโซน</div>
      <div>กด "+ เพิ่มโซน" ด้านบนเพื่อเริ่มจัดตี้</div>
    </div>`;
    return;
  }
  board.innerHTML = tbState.zones.map(zone => renderZone(zone)).join('');
  bindZoneEvents();
}

function renderZone(zone) {
  const teamsHtml = zone.teams.map(team => renderTeam(zone.id, team)).join('');
  return `
  <section class="zone" data-zone-id="${zone.id}">
    <div class="zone-head">
      <input class="zone-title-input" data-role="zone-name" data-zone-id="${zone.id}" value="${escapeHtml(zone.name)}" placeholder="ชื่อโซน">
      <div class="zone-actions">
        <button class="icon-btn" title="เพิ่มทีมในโซนนี้" data-role="add-team" data-zone-id="${zone.id}">＋</button>
        <button class="icon-btn danger" title="ลบโซนนี้" data-role="del-zone" data-zone-id="${zone.id}">✕</button>
      </div>
    </div>
    <div class="zone-body">
      ${teamsHtml}
      <button class="add-team-btn" data-role="add-team" data-zone-id="${zone.id}">+ เพิ่มทีม</button>
    </div>
  </section>`;
}

function renderTeam(zoneId, team) {
  const filled = team.slots.filter(Boolean).length;
  const slotsHtml = team.slots.map((name, idx) => renderSlot(zoneId, team.id, idx, name)).join('');
  return `
  <div class="team-card" data-team-id="${team.id}" data-zone-id="${zoneId}">
    <div class="team-head">
      <input class="team-name-input" data-role="team-name" data-zone-id="${zoneId}" data-team-id="${team.id}" value="${escapeHtml(team.name)}" placeholder="ชื่อทีม">
      <span class="team-fill ${filled === SLOT_COUNT ? 'full' : ''}">${filled}/${SLOT_COUNT}</span>
      <button class="icon-btn danger" title="ลบทีมนี้" data-role="del-team" data-zone-id="${zoneId}" data-team-id="${team.id}" style="width:24px;height:24px;font-size:0.8rem;">✕</button>
    </div>
    <div class="slot-list">${slotsHtml}</div>
  </div>`;
}

function renderSlot(zoneId, teamId, idx, name) {
  if (!name) {
    return `<div class="slot" data-zone-id="${zoneId}" data-team-id="${teamId}" data-slot-idx="${idx}">ว่าง</div>`;
  }
  const cls = playerClass(name);
  const color = cls ? CLASS_COLOR[cls] : 'var(--gold)';
  return `<div class="slot filled" draggable="true" data-zone-id="${zoneId}" data-team-id="${teamId}" data-slot-idx="${idx}" style="--accent:${color}">
    <span class="slot-class-bar"></span>
    <span class="slot-name">${cls ? `<img class="chip-icon" src="${classIcon(cls)}">` : ''}${escapeHtml(name)}</span>
    <button class="slot-remove" data-role="remove-slot" data-zone-id="${zoneId}" data-team-id="${teamId}" data-slot-idx="${idx}" title="นำออก">✕</button>
  </div>`;
}

/* ── ZONE/TEAM/SLOT EVENTS ─────────────────────────────────── */
function bindZoneEvents() {
  const board = document.getElementById('tbBoard');

  board.querySelectorAll('[data-role="zone-name"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const zone = tbState.zones.find(z => z.id === inp.dataset.zoneId);
      if (zone) { zone.name = inp.value || 'โซนใหม่'; tbPersist(); }
    });
  });

  board.querySelectorAll('[data-role="team-name"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const zone = tbState.zones.find(z => z.id === inp.dataset.zoneId);
      const team = zone && zone.teams.find(t => t.id === inp.dataset.teamId);
      if (team) { team.name = inp.value || 'ทีมใหม่'; tbPersist(); }
    });
  });

  board.querySelectorAll('[data-role="add-team"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const zone = tbState.zones.find(z => z.id === btn.dataset.zoneId);
      if (zone) { zone.teams.push(mkTeam('ทีมใหม่ ' + (zone.teams.length + 1))); tbPersist(); renderBoard(); }
    });
  });

  board.querySelectorAll('[data-role="del-team"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const zone = tbState.zones.find(z => z.id === btn.dataset.zoneId);
      if (!zone) return;
      if (!confirm('ลบทีมนี้? ผู้เล่นในทีมจะกลับไปคลังกำลังพล')) return;
      zone.teams = zone.teams.filter(t => t.id !== btn.dataset.teamId);
      tbPersist(); renderBoard(); renderPool();
    });
  });

  board.querySelectorAll('[data-role="del-zone"]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('ลบโซนนี้ทั้งหมด? ผู้เล่นในโซนจะกลับไปคลังกำลังพล')) return;
      tbState.zones = tbState.zones.filter(z => z.id !== btn.dataset.zoneId);
      tbPersist(); renderBoard(); renderPool();
    });
  });

  board.querySelectorAll('[data-role="remove-slot"]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSlot(btn.dataset.zoneId, btn.dataset.teamId, parseInt(btn.dataset.slotIdx), null);
      tbPersist(); renderBoard(); renderPool();
    });
  });

  board.querySelectorAll('.slot.filled').forEach(slot => {
    slot.addEventListener('dragstart', e => {
      const name = slot.querySelector('.slot-name').textContent;
      tbDragData = { player: name, from: { zoneId: slot.dataset.zoneId, teamId: slot.dataset.teamId, slotIdx: parseInt(slot.dataset.slotIdx) } };
      slot.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    slot.addEventListener('dragend', () => { slot.classList.remove('dragging'); tbDragData = null; });
  });

  board.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; slot.classList.add('drag-over'); });
    slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('drag-over');
      if (!tbDragData) return;
      const toZoneId = slot.dataset.zoneId, toTeamId = slot.dataset.teamId, toIdx = parseInt(slot.dataset.slotIdx);
      const targetCurrent = getSlot(toZoneId, toTeamId, toIdx);
      if (targetCurrent) { showToast(`ช่องนี้มี ${targetCurrent} อยู่แล้ว — นำออกก่อนเพื่อสลับ`); return; }
      if (tbDragData.from) setSlot(tbDragData.from.zoneId, tbDragData.from.teamId, tbDragData.from.slotIdx, null);
      setSlot(toZoneId, toTeamId, toIdx, tbDragData.player);
      tbDragData = null;
      tbPersist(); renderBoard(); renderPool();
    });
  });
}

function getSlot(zoneId, teamId, idx) {
  const zone = tbState.zones.find(z => z.id === zoneId);
  const team = zone && zone.teams.find(t => t.id === teamId);
  return team ? team.slots[idx] : null;
}
function setSlot(zoneId, teamId, idx, value) {
  const zone = tbState.zones.find(z => z.id === zoneId);
  const team = zone && zone.teams.find(t => t.id === teamId);
  if (team) team.slots[idx] = value;
}

/* ── INIT (runs once, on first visit to the Team Build tab) ── */
function initTeamBuilder() {
  tbLoad();
  renderTbLegend();
  renderBoard();
  renderPool();

  document.getElementById('btnAddZone').addEventListener('click', () => {
    tbState.zones.push({ id: uid(), name: 'โซนใหม่', teams: [mkTeam('ทีม 1')] });
    tbPersist(); renderBoard();
  });
  document.getElementById('btnClearBoard').addEventListener('click', () => {
    if (!confirm('ล้างกระดานทั้งหมด? การจัดทีมทั้งหมดจะถูกลบ (ผู้เล่นจะกลับไปคลังกำลังพล)')) return;
    tbState.zones = [];
    tbPersist(); renderBoard(); renderPool();
  });
  document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(tbState, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'vongola_warboard.json'; a.click();
    URL.revokeObjectURL(url);
    showToast('ส่งออกไฟล์แล้ว');
  });
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
  document.getElementById('fileImport').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed && Array.isArray(parsed.zones)) {
          tbState = parsed;
          tbPersist(); renderBoard(); renderPool();
          showToast('นำเข้าไฟล์สำเร็จ');
        } else { showToast('ไฟล์ไม่ถูกต้อง'); }
      } catch (err) { showToast('อ่านไฟล์ไม่สำเร็จ'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('poolSearch').addEventListener('input', renderPool);
}
